# One command runs the whole stack: Ollama (embeddings + LLM) and the VectorDB server.
#   docker compose up --build
# Then open http://localhost:8080
# The first start downloads the two models (~2.3 GB), so give it a few minutes.

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Pulls the models once, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text && ollama pull llama3.2"]
    restart: "no"

  vectordb:
    build: .
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      - VECTORDB_OLLAMA_HOST=ollama
      - VECTORDB_OLLAMA_PORT=11434
    ports:
      - "8080:8080"

volumes:
  ollama-models:
